name: Publish door image to GHCR

# Build + push the vivijure-local-16gb consumer-door image (CogVideoX i2v, runs on the user own GPU) so
# a novice PULLS a prebuilt image instead of cold-building torch layers on their box (Conrad ease-of-
# installation ruling; issue #23). Image + version come from a git TAG, never a parsed commit subject:
#
#   vX.Y.Z  ->  ghcr.io/skyphusion-labs/vivijure-local-16gb:X.Y.Z (+ :latest)
#
# A plain commit/branch push is a NO-OP: this workflow triggers ONLY on v* tags (or a maintainer
# workflow_dispatch). This pipeline BUILDS + PUSHES; it does not deploy anything (a local door has no
# serverless endpoint -- the operator pulls the image via docker-compose.yml).
#
# THIN BUILD: this image is `FROM <runtime base>@digest` + COPY src (see deploy/Dockerfile). The heavy
# CUDA/torch/deps install lives in the runtime base (deploy/runtime.Dockerfile, built by
# runtime-build.yml), so a src-only release re-pushes ONLY the app layer -- the ~10 min torch +
# diffusers/transformers install does NOT run here. That is the runner-cost win: the slow bake happens
# rarely (a toolchain bump or the monthly CVE floor), not on every release.
#
# Runner: GitHub-hosted `ubuntu-latest`, the only live CI plane. BOTH predecessors are gone: the Plane C
# self-hosted pool (org group "vivijure-gpu-builds", labels [self-hosted, bake-capable]) went with the
# fleet decommission on 2026-09-24 (cost), and the GitHub-hosted larger runner "vivijure-bake-local"
# this once used was retired earlier (fc#754). Do not reintroduce either: a job pinned to a dead
# self-hosted label does not fail, it QUEUES forever and silently. The build step below runs NO
# pull:true (digest-pinned FROM, docker driver reuses the daemon cache), which caps the disk cost but
# does not remove it; an ~8GB runtime base still has to land on a runner with roughly 14GB free, which
# is less headroom than either predecessor had, so the disk-reclaim step below is REQUIRED and not
# decoration. Doctrine: fleet-chezmoi docs/runbooks/gh-runner-doctrine.md. Fork-safe via the org
# fork-pr-contributor-approval backstop, and because this workflow triggers ONLY on v* tags +
# maintainer workflow_dispatch, which a fork cannot create, so packages:write is never exposed to
# a fork. (The runner-group workflow allowlist was a THIRD control here; it is gone with the pool,
# and it protected the self-hosted runners, never this hosted job.)
#
# The `sync-gpu-allowlist` job that used to run here was REMOVED 2026-09-25 (runner-group
# retirement lane, CR fleet-chezmoi#2160). It appended this repo's tag refs to the
# `vivijure-gpu-builds` org runner group (id 9), the Plane C bake pool, which has had ZERO
# runners since the 2026-09-24 fleet decommission. Its sync script was deleted from
# fleet-chezmoi the same day (commit 0b5c8b4), so the job could no longer even succeed: it
# would fail on the missing file and, through `needs`, SKIP the build-and-push job below. The group's 119
# workflow refs and 8 repo pinnings are preserved untouched, so standing Plane C back up
# re-adds this sync as part of provisioning the pool. Do not re-add it here.
#
# NOTE vs vivijure-backend release.yml (the model): the backend BAKES ~90GB of weights (seed image, R2
# stage, bin-packed layers). This door BAKES NO weights (CogVideoX pulls on the first render into a
# volume), so its runtime base is a plain ~8GB CUDA/torch/deps image and this release is a plain thin
# build + push. GHCR auth uses the built-in GITHUB_TOKEN (packages:write below), least privilege.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version X.Y.Z (manual build; a tag build derives it from the tag)."
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: skyphusion-labs
  IMAGE: vivijure-local-16gb

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space (hosted runner; the retired larger runners had the headroom this replaces)
        if: runner.environment == 'github-hosted'
        run: |
          set -eu
          echo "--- before ---"; df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune -af || true
          echo "--- after ---"; df -h /

      - name: Resolve version
        id: cfg
        env:
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VER="${INPUT_VERSION}"
          else
            # github.ref_name is the tag on a tag push, e.g. "v0.1.0".
            TAG="${GITHUB_REF_NAME}"
            if [[ "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              VER="${BASH_REMATCH[1]}"
            else
              echo "::error::Tag '${TAG}' is not a vX.Y.Z release tag; nothing to build."
              exit 1
            fi
          fi
          if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '${VER}' is not X.Y.Z"; exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE}:${VER} (+ :latest)."

      # DOCKER driver (not the default docker-container driver): the build cache IS the daemon image
      # store. That WAS a warm-runner win -- on the retired snapshot runner the pre-pulled runtime base
      # was a local hit for `FROM runtime@digest`, while the container driver kept a cache disjoint from
      # the daemon store and `pull: true` re-pulled regardless (S19 platform finding). Every hosted
      # runner is cold, so that hit is gone and the base is pulled once per run. The driver choice stays:
      # the FROM is digest-pinned, so pull-if-absent is correct, and NO pull:true keeps it to one pull.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver: docker

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push :X.Y.Z and :latest
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}:${{ steps.cfg.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}:latest

      - name: Summary
        run: |
          echo "Pushed ${IMAGE}:${{ steps.cfg.outputs.version }} and :latest to ${REGISTRY}/${OWNER}."
